# 拼豆本地开发依赖：PostgreSQL 16
# 启动：docker compose up -d
# 停止：docker compose down

services:
  postgres:
    image: postgres:16
    container_name: pindou-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pindou
      POSTGRES_PASSWORD: pindou_dev
      POSTGRES_DB: pindou
    volumes:
      - pindou_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pindou -d pindou"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pindou_pg_data:
