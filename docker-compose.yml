# 拼豆本地开发依赖：PostgreSQL 16 + Redis 7
# 启动：docker compose up -d
# 停止：docker compose down

services:
  postgres:
    image: postgres:16
    container_name: pindou-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pindou
      POSTGRES_PASSWORD: pindou_dev
      POSTGRES_DB: pindou
    volumes:
      - pindou_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pindou -d pindou"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: pindou-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pindou_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pindou_pg_data:
  pindou_redis_data:
